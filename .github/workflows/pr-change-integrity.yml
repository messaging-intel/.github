name: PR change integrity

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  changed-lines:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR changes without printing private content
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid commit reference"
            exit 1
          }
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          # Do not print changed source lines: they can contain private data.
          if ! git diff --check "$MERGE_BASE" "$HEAD_SHA" -- >/dev/null 2>&1; then
            echo "::error::New whitespace defect or conflict marker"
            exit 1
          fi
          git diff --no-ext-diff --no-color --unified=0 "$MERGE_BASE" "$HEAD_SHA" -- |
            awk '
              /^\+\+\+/ { next }
              /^\+<<<<<<<([[:space:]]|$)/ { conflict = 1 }
              /^\+>>>>>>>[[:space:]]/ { conflict = 1 }
              /^\+=======$/ { conflict = 1 }
              /^\+\|\|\|\|\|\|\|([[:space:]]|$)/ { conflict = 1 }
              /^\+.*-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----/ { secret = 1 }
              /^\+/ {
                if (match($0, /ghp_[[:alnum:]]+/) && RLENGTH >= 34) secret = 1
                if (match($0, /github_pat_[[:alnum:]_]+/) && RLENGTH >= 45) secret = 1
              }
              END {
                if (conflict) print "::error::New unresolved conflict markers" > "/dev/stderr"
                if (secret) print "::error::New credential-like material" > "/dev/stderr"
                if (conflict || secret) exit 1
              }'
