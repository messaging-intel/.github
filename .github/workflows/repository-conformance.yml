name: repository conformance

on:
  pull_request:
    paths:
      - "policies/repository-conformance.v1.json"
      - "scripts/audit_repository_conformance.py"
      - "tests/test_repository_conformance.py"
      - ".github/workflows/repository-conformance.yml"
  push:
    branches: [main]
    paths:
      - "policies/repository-conformance.v1.json"
      - "scripts/audit_repository_conformance.py"
      - "tests/test_repository_conformance.py"
      - ".github/workflows/repository-conformance.yml"
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/audit_repository_conformance.py --validate-policy-only
      - run: python3 -m unittest tests/test_repository_conformance.py

  live-organization-audit:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: policy-contract
    env:
      MSGINT_CONFORMANCE_READ_TOKEN: ${{ secrets.MSGINT_CONFORMANCE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/audit_repository_conformance.py
